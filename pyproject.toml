[project]
name = "shelfwarden"
version = "0.1.0"
description = "An agentic media library steward for Plex"
authors = [
    { name = "Todd", email = "321231505+tritter95@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "plexapi>=4.18.2",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "typer>=0.27",
]

[project.scripts]
shelfwarden = "shelfwarden.cli:app"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "import-linter",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff formats Python code blocks inside Markdown. Documentation here is
# hand-authored prose whose snippets are sometimes deliberately non-idiomatic
# (docs/development-practices.md shows a recipe that does NOT work, on purpose),
# and docs/shelfwarden.md is the project spec. Source tooling must not rewrite them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# --strict-markers turns a typo'd marker into an error rather than a silent no-op,
# which matters most for `live`: a mistyped skip marker is a test that quietly
# starts calling a real API. --strict-config does the same for this table.
addopts = "--strict-markers --strict-config"
xfail_strict = true
# Turned on while the suite is small and warning-free. The expensive order is the
# other one -- switching this on after warnings have accumulated.
filterwarnings = ["error"]
markers = [
    "slow: excluded from the per-commit suite; runs nightly (practices §8.4)",
    "live: touches a real external service; never runs in CI (practices §8.1)",
]

[tool.importlinter]
root_package = "shelfwarden"
# REQUIRED: import-linter refuses to run at all when a contract forbids an
# external module and this is unset.
include_external_packages = true

# These contracts deliberately carry no `ignore_imports` yet. Nothing imports
# plexapi, openai, or anthropic, so the strict form is honest -- and the first
# import that lands outside its adapter breaks CI at exactly the step that
# introduces it. The lines to add then are recorded per contract below.
#
# Two verified traps, both of which fail confusingly:
#   * `plexapi*` is rejected -- "a wildcard can only replace a whole module". A
#     wildcard must occupy a whole dotted segment. For an EXTERNAL package one
#     bare line is also all that matches, because grimp collapses the package to
#     a single node; `plexapi.**` would match nothing and fail the run.
#   * An `ignore_imports` line that matches nothing fails the run outright, which
#     is the reason these are commented out rather than written ahead of time.
# See docs/plans/step-0.1-scaffold.md and docs/development-practices.md §1.3.

[[tool.importlinter.contracts]]
name = "plexapi is confined to the Plex adapter"
type = "forbidden"
source_modules = ["shelfwarden"]
forbidden_modules = ["plexapi"]
# Added in step 0.3, when library/plex.py first imported plexapi.
#
# ONE line, not two. Under include_external_packages, grimp collapses an entire
# external package to a single top-level module: `import plexapi.utils` and
# `from plexapi.server import PlexServer` are both recorded as `-> plexapi`. A
# `plexapi.**` line therefore matches nothing, and an unmatched ignore fails the
# run outright. (The submodule form IS needed for *internal* modules, where each
# is a distinct node.)
ignore_imports = ["shelfwarden.library.plex -> plexapi"]

[[tool.importlinter.contracts]]
name = "the OpenAI SDK is confined to its provider adapter"
type = "forbidden"
source_modules = ["shelfwarden"]
forbidden_modules = ["openai"]
# Step 1.2 adds (one line -- see the note on the plexapi contract above):
#   ignore_imports = ["shelfwarden.agent.provider.openai -> openai"]

[[tool.importlinter.contracts]]
name = "the Anthropic SDK is confined to its provider adapter"
type = "forbidden"
source_modules = ["shelfwarden"]
forbidden_modules = ["anthropic"]
# Step 1.8 adds (one line -- see the note on the plexapi contract above):
#   ignore_imports = ["shelfwarden.agent.provider.anthropic -> anthropic"]

[[tool.importlinter.contracts]]
name = "the tool layer is MCP-extractable"
type = "forbidden"
source_modules = ["shelfwarden.agent.tools"]
forbidden_modules = [
    "shelfwarden.agent.loop",
    "shelfwarden.agent.provider",
    "shelfwarden.evals",
]

[[tool.importlinter.contracts]]
name = "the export depends on the provider protocol, not the Plex adapter"
type = "forbidden"
source_modules = ["shelfwarden.evals"]
forbidden_modules = ["shelfwarden.library.plex"]
# Added in step 0.4. `evals/` imports `library/base.py` freely -- the protocol is
# the whole point -- but never the adapter. That is what keeps the export's
# byte-identity test offline permanently rather than until someone needs
# `machineIdentifier` in a hurry, and it is library.plex's own confinement rule
# pointed the other way. See docs/plans/step-0.4-export-census.md §3.7.

[[tool.importlinter.contracts]]
name = "the comparator library is a leaf"
type = "forbidden"
source_modules = ["shelfwarden.compare"]
forbidden_modules = [
    "shelfwarden.agent",
    "shelfwarden.evals",
    "shelfwarden.library",
    "shelfwarden.sources",
]
# Added in step 0.45. The comparators are shared by the screen (0.45), the
# detectability witness (0.5), the scorer (0.8) -- all in `evals/` -- and by the
# validator's *support* and referent-binding checks in `agent/validate.py`
# (1.4). Leaving the module in `evals/` would make the agent import the package
# holding the answer key and would make the Phase 5 MCP extraction carry
# `evals/` with it. That import does not exist yet, so this contract is honest
# today and breaks CI at exactly the step that would violate it -- which is how
# the other five behave. See docs/plans/step-0.45-comparators-screen.md,
# Finding 5 and Decision 1.

[[tool.importlinter.contracts]]
name = "library and sources do not import the agent"
type = "forbidden"
source_modules = ["shelfwarden.library", "shelfwarden.sources"]
forbidden_modules = ["shelfwarden.agent"]
